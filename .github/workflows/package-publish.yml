name: Publish Svartz packages

on:
  workflow_call:
    inputs:
      sha:
        description: Full release merge commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: svartz-npm-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: github.repository == 'mia-cx/svartz'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    env:
      SVARTZ_RELEASE_SHA: ${{ inputs.sha }}
      SVARTZ_RELEASE_RETRY: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Pin provenance to the release commit
        run: |
          if [ "$GITHUB_SHA" != "${{ inputs.sha }}" ]; then
            echo "::error::Commits landed on the release branch after this release commit. npm provenance records the workflow head, so publish a new patch release with a changeset instead of retrying."
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - name: Install pinned npm with trusted publishing support
        run: npm install --global npm@11.17.0
      - name: Verify the release merge and reject superseded versions
        run: |
          node scripts/release-plan.mjs current
          plan="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SVARTZ_RELEASE_SHA/pulls" --paginate --slurp | node scripts/release-plan.mjs)"
          printf '%s\n' "$plan"
          test "$(printf '%s\n' "$plan" | grep '^release=')" = release=true
          test "$(printf '%s\n' "$plan" | grep '^publish=')" = publish=true
          packages="$(printf '%s\n' "$plan" | grep '^packages=' | cut -d= -f2-)"
          echo "SVARTZ_RELEASE_PACKAGES=$packages" >> "$GITHUB_ENV"
      - run: pnpm build
      - name: Publish pnpm archives in dependency order through trusted publishing
        run: node scripts/release-publish.mjs publish
      - name: Tag packages and create the combined GitHub release
        run: node scripts/release-github.mjs
