name: Release validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to validate
        required: true
        type: string
  workflow_call:
    inputs:
      sha:
        description: Full release commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.event.pull_request.number || inputs.sha || github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validation:
    if: github.event_name != 'pull_request' || github.head_ref == 'changeset-release/sveltekit-rewrite'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm --filter @svartz/ui exec playwright install --with-deps chromium
      - run: pnpm test:release
      - run: pnpm build
      - run: pnpm test
      - run: pnpm release:check
