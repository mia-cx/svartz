name: Docs deploy

# Deploys svartz.mia.cx and the theme demos from the default branch. Each vault in svartz.config.ts is its own Worker.

on:
  push:
    branches: [sveltekit-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per ref, so a skipped dispatch from another branch never cancels a production deploy.
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    # A manual dispatch can pick any branch; only the default branch deploys.
    if: github.repository == 'mia-cx/svartz' && github.ref == 'refs/heads/sveltekit-rewrite'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Notes without frontmatter dates take theirs from git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      # On a clean install the CLI isn't built when pnpm links bins, so run its entry directly.
      - run: node packages/cli/dist/index.js build:all
      - name: Deploy each vault's Worker
        run: |
          for config in "$GITHUB_WORKSPACE"/.svartz/vaults/*/wrangler.json; do
            pnpm --filter svartz exec wrangler deploy --config "$config"
          done
