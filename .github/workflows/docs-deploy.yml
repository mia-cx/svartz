name: Docs deploy

# Deploys svartz.mia.cx and the theme demos from the default branch. Each vault in svartz.config.ts is its own Worker.

on:
  push:
    branches: [sveltekit-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: github.repository == 'mia-cx/svartz'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - run: pnpm svartz build:all
      - name: Deploy each vault's Worker
        run: |
          for config in "$GITHUB_WORKSPACE"/.svartz/vaults/*/wrangler.json; do
            pnpm --filter svartz exec wrangler deploy --config "$config"
          done
