name: Docs deploy

# Deploys the docs and the theme demos, each vault in svartz.config.ts its own Worker. A push to main deploys staging
# (staging.svartz.dev); the Release workflow deploys production (svartz.dev) once a release has published.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Staging deploys main; production redeploys the latest release
        type: choice
        options: [staging, production]
        default: staging
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      sha:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TARGET: ${{ inputs.environment || 'staging' }}

jobs:
  commit:
    # A manual dispatch can pick any branch; only main deploys.
    if: github.repository == 'mia-cx/svartz' && github.ref == 'refs/heads/main'
    # Outside the deploy's concurrency group, so a stale production run fails here and never takes a valid run's place
    # in the queue.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Pick the commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          # Production serves the latest published release: never the branch tip, and never an older release.
          if [ "$TARGET" != production ]; then echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; exit; fi
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [ -n "$RELEASE_SHA" ] && [ "$RELEASE_SHA" != "$latest" ]; then
            echo "::error::$RELEASE_SHA isn't the latest release ($tag, $latest), so production keeps its docs."
            exit 1
          fi
          echo "sha=$latest" >> "$GITHUB_OUTPUT"

  deploy:
    needs: commit
    # One deploy per environment at a time. A newer staging push replaces an older one; production runs queue and
    # never cut a rollout short.
    concurrency:
      group: docs-deploy-${{ inputs.environment || 'staging' }}
      cancel-in-progress: ${{ (inputs.environment || 'staging') != 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SHA: ${{ needs.commit.outputs.sha }}
    steps:
      - name: Check the release is still the latest
        if: env.TARGET == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A newer release may have published while this run waited its turn.
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [ "$SHA" != "$latest" ]; then
            echo "::error::$SHA was superseded by $tag ($latest) while waiting, so production keeps the newer docs."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          # Notes without frontmatter dates take theirs from git history.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      # On a clean install the CLI isn't built when pnpm links bins, so run its entry directly.
      - run: node packages/cli/dist/index.js build:all
      - name: Check there are Workers to deploy
        run: |
          shopt -s nullglob
          configs=("$GITHUB_WORKSPACE"/.svartz/vaults/*/wrangler.json)
          if [ ${#configs[@]} -eq 0 ]; then
            echo "::error::This commit builds no cloudflare-workers vaults, so there is nothing to deploy. Releases up to svartz@2.5.0 predate the Worker docs; production first deploys from the release after them."
            exit 1
          fi
      - name: Keep staging out of search engines
        if: env.TARGET != 'production'
        run: |
          # Every static response, prerendered pages included, carries noindex. Production builds never get the rule.
          for config in "$GITHUB_WORKSPACE"/.svartz/vaults/*/wrangler.json; do
            printf '\n/*\n  X-Robots-Tag: noindex\n' >> "$(dirname "$config")/$(jq -r .assets.directory "$config")/_headers"
          done
      - name: Deploy each vault's Worker
        run: |
          # Production is each Worker's top-level config; staging is its `staging` environment.
          flags=()
          [ "$TARGET" = production ] || flags=(--env staging)
          for config in "$GITHUB_WORKSPACE"/.svartz/vaults/*/wrangler.json; do
            pnpm --filter svartz exec wrangler deploy --config "$config" "${flags[@]}"
          done
